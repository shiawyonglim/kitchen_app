name: PersonalERP
options:
  bundleIdPrefix: com.shiawyong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  PersonalERP:
    type: application
    platform: iOS
    sources:
      - path: PersonalERP
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiawyong.personalerp
        INFOPLIST_FILE: PersonalERP/Info.plist
        CODE_SIGN_ENTITLEMENTS: PersonalERP/PersonalERP.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: PersonalERPWidget
        embed: true

  PersonalERPWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PersonalERPWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiawyong.personalerp.widget
        INFOPLIST_FILE: PersonalERPWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PersonalERPWidget/PersonalERPWidget.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
