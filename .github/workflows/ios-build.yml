name: Build iOS App (Unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/PersonalERP.xcodeproj \
            -scheme PersonalERP \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PersonalERP.app Payload/
          zip -qry PersonalERP-unsigned.ipa Payload

      - name: Upload PersonalERP-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: PersonalERP-unsigned-ipa
          path: PersonalERP-unsigned.ipa
