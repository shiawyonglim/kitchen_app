name: Build iOS App (Unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject build-time widget config from secrets
        env:
          WIDGET_BASE_URL: ${{ secrets.WIDGET_BASE_URL }}
          WIDGET_API_TOKEN: ${{ secrets.WIDGET_API_TOKEN }}
        run: |
          if [ -n "$WIDGET_BASE_URL" ]; then
            /usr/libexec/PlistBuddy -c "Delete :ERPWidgetBaseURL" ios/PersonalERP/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :ERPWidgetBaseURL string $WIDGET_BASE_URL" ios/PersonalERP/Info.plist
            /usr/libexec/PlistBuddy -c "Delete :ERPWidgetBaseURL" ios/PersonalERPWidget/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :ERPWidgetBaseURL string $WIDGET_BASE_URL" ios/PersonalERPWidget/Info.plist
          fi
          if [ -n "$WIDGET_API_TOKEN" ]; then
            /usr/libexec/PlistBuddy -c "Delete :ERPWidgetToken" ios/PersonalERPWidget/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :ERPWidgetToken string $WIDGET_API_TOKEN" ios/PersonalERPWidget/Info.plist
          fi

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/PersonalERP.xcodeproj \
            -scheme PersonalERP \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PersonalERP.app Payload/
          zip -qry PersonalERP-unsigned.ipa Payload

      - name: Upload PersonalERP-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: PersonalERP-unsigned-ipa
          path: PersonalERP-unsigned.ipa
